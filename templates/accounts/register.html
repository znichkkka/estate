{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
    <h1>Регистрация</h1>
    <p>Владелец размещает объекты, соискатель отправляет заявки на аренду или покупку.</p>
    <form method='post'>
        {% csrf_token %}
        {{ form.as_p }}
        <button type='submit'>Зарегистрироваться</button>
    </form>
{% endblock %}
